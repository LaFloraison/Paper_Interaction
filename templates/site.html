<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pi-spec" content="v5">
<title>PI-LOADING · {{TITLE}} | Paper_Interaction</title>
<style>
<!--PI-STYLE-->
</style>
</head>
<body>
<div id="progressBar"><div id="progressFill"></div></div>
<header id="topbar">
  <button id="menuBtn" aria-label="Outline">☰</button>
  <div id="topbarTitle">{{HEAD_TITLE}}<span class="tb-sub">{{SUBTITLE}}</span></div>
  <div id="chapStrip"></div>
  <button id="paperBtn" aria-pressed="false" title="Show the original paper alongside (P)">▥ Paper</button>
</header>
<nav id="outline">
  <div id="outlineHead"><span>Outline</span> · <span id="outlineCount">{{COUNT}}</span><button id="outlineClose">✕</button></div>
  <ul id="outlineList"></ul>
  <div id="outlineFoot"><button id="expandAll">Expand all</button><button id="collapseAll">Collapse all</button></div>
</nav>
<div id="scrim"></div>

<main id="cardArea">
<!--CARD-CONTENT-->
</main>

<aside id="paperPane" class="hidden" aria-label="Original paper passage">
  <div class="pp-head">
    <span class="pp-tag" id="ppTag">p.—</span>
    <button class="pp-sync" id="ppSync" title="Show the passage this card is built from">↩ This card's passage</button>
  </div>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-fig" id="ppFig" hidden></div>
  <div class="pp-nav">
    <button id="ppPrev">◀ Previous paragraph</button>
    <button id="ppNext">Next paragraph ▶</button>
  </div>
  <div id="paperPages" hidden>{{PAPER-PAGES}}</div>
</aside>

<nav id="navbar">
  <button id="navPrev">← Back</button>
  <div id="pageNum">1 / {{COUNT}}</div>
  <button id="navNext">Continue →</button>
</nav>

<div id="editorOverlay">
  <div class="edbox">
    <h3>Insert your own card</h3>
    <p class="dim">Placed right after the anchor card; stored locally in your browser.</p>
    <label for="edAnchor">Anchor card number (insert after)</label>
    <input id="edAnchor" type="text" readonly>
    <label for="edTitle">Title</label>
    <input id="edTitle" type="text">
    <label for="edBody">Content</label>
    <textarea id="edBody" rows="6"></textarea>
    <button class="btn" id="edSave">Save</button>
    <button class="btn-ghost btn" id="edCancel">Cancel</button>
  </div>
</div>

<script id="pi-core">
<!--PI-CORE-->
</script>
<script id="pi-widgets">
<!--PI-WIDGETS-->
</script>
</body>
</html>
